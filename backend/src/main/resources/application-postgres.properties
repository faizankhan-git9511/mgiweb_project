# PostgreSQL Profile for Render Cloud Deployment
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/kaamchahiye}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

# JPA / Hibernate Configuration for PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Disable MSSQL-specific Flyway scripts in PostgreSQL profile to allow Hibernate DDL auto-generation
spring.flyway.enabled=false

# Security & JWT Configuration
app.jwt.secret=${JWT_SECRET:KaamChahiyeSuperSecretJWTKey98765432109876543210KaamChahiye}
app.jwt.expiration-ms=86400000
