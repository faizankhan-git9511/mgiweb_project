spring.application.name=kaamchahiye-backend
server.port=${PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Database Configuration - Microsoft SQL Server (MSSQL Local Default)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=kaamchahiye;encrypt=true;trustServerCertificate=true;
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=YourStrongPassword123!

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:KaamChahiyeSuperSecretJWTKey98765432109876543210KaamChahiye}
app.jwt.expiration-ms=86400000
