# Standalone H2 In-Memory Database Profile for instant zero-config testing
spring.datasource.url=jdbc:h2:mem:kaamchahiye;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MSSQLServer
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=false
spring.h2.console.enabled=true

# JWT Security Configuration
app.jwt.secret=KaamChahiyeSuperSecretJWTKey98765432109876543210KaamChahiye
app.jwt.expiration-ms=86400000
