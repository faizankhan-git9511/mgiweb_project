# Render Infrastructure as Code Blueprint for KaamChahiye Full-Stack App
services:
  # 1. Backend Web Service (Docker Container)
  - type: web
    name: kaamchahiye-backend
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    healthCheckPath: /api/platform/info
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: kaamchahiye-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "https://kaamchahiye-frontend.onrender.com"

  # 2. Frontend Web Service (Static Site)
  - type: web
    name: kaamchahiye-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: kaamchahiye-backend
          property: url

databases:
  # 3. Managed PostgreSQL Database
  - name: kaamchahiye-db
    databaseName: kaamchahiye
    user: kaamchahiye_user
    plan: free
    region: singapore
